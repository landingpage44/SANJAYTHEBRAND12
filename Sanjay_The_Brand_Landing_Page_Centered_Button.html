<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#08090d">
<title>Sanjay The Brand</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#07080c;color:#fff}
body{display:flex;align-items:center;justify-content:center;position:relative}
body:before{content:"";position:absolute;inset:-30%;background:
radial-gradient(circle at 50% 20%,rgba(225,164,54,.16),transparent 24%),
radial-gradient(circle at 15% 80%,rgba(20,142,255,.10),transparent 25%),
radial-gradient(circle at 90% 60%,rgba(255,174,45,.08),transparent 25%);
animation:bg 8s ease-in-out infinite alternate}
@keyframes bg{to{transform:scale(1.08);opacity:.9}}

.card{position:relative;width:min(92vw,520px);height:min(94vh,820px);max-height:820px;
background:rgba(17,17,23,.94);border:1px solid rgba(255,193,69,.25);border-radius:22px;
box-shadow:0 0 45px rgba(0,0,0,.6),0 0 35px rgba(231,164,45,.08);
display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;overflow:hidden}
.card:after{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;
background:linear-gradient(130deg,transparent 35%,rgba(255,210,120,.05),transparent 65%);animation:shine 5s linear infinite}
@keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}

.logo-wrap{width:125px;height:125px;border-radius:50%;padding:6px;background:linear-gradient(135deg,#fff0a6,#ffb52e,#8d4e00);
box-shadow:0 0 28px rgba(255,177,47,.42);margin-bottom:22px;z-index:1}
.logo{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.brand{font-size:20px;letter-spacing:5px;color:#d8d8df;margin-bottom:18px;font-weight:700;z-index:1;text-align:center}




.info{width:100%;display:flex;flex-direction:column;gap:12px;align-items:center;z-index:1}
.pill{width:94%;min-height:58px;border-radius:14px;background:#202025;border-left:4px solid #18a8ff;
display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 14px;
font-size:15px;font-weight:800;line-height:1.35;box-shadow:0 5px 16px rgba(0,0,0,.18)}
.pill.small{width:auto;min-height:48px;padding:8px 22px}
.join{position:relative;margin-top:24px;width:98%;height:78px;border:0;border-radius:40px;
background:linear-gradient(110deg,#0077ff,#00b7ff,#1778ff,#00c6ff,#0077ff);background-size:300% 100%;
color:#fff;font-size:19px;font-weight:900;letter-spacing:.4px;cursor:pointer;overflow:hidden;
box-shadow:0 10px 30px rgba(0,151,255,.35),0 0 0 1px rgba(255,255,255,.12) inset;
animation:buttonGradient 3.2s linear infinite,buttonFloat 2.2s ease-in-out infinite;z-index:2;
transition:transform .2s ease,filter .2s easedisplay:flex;align-items:center;justify-content:center;text-align:center;padding:0 18px}
.join:before{content:"";position:absolute;top:-40%;left:-45%;width:38%;height:180%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
transform:skewX(-22deg);animation:buttonShine 2.1s ease-in-out infinite;pointer-events:none}
.join:after{content:"";position:absolute;inset:3px;border-radius:38px;border:1px solid rgba(255,255,255,.22);pointer-events:none}
.join:hover{transform:translateY(-3px) scale(1.015);filter:brightness(1.12)}
.join:active{transform:scale(.98)}
@keyframes buttonGradient{0%{background-position:0% 50%}100%{background-position:300% 50%}}
@keyframes buttonShine{0%,35%{left:-45%;opacity:0}50%{opacity:1}72%,100%{left:125%;opacity:0}}
@keyframes buttonFloat{0%,100%{box-shadow:0 10px 30px rgba(0,151,255,.32),0 0 0 0 rgba(0,183,255,.32)}
50%{box-shadow:0 14px 38px rgba(0,151,255,.52),0 0 0 9px rgba(0,183,255,0)}}
.join-content{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:100%;text-align:center}
.arrow{display:inline-block;font-size:21px;animation:arrowMove .8s ease-in-out infinite}
@keyframes arrowMove{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.note{margin-top:14px;color:#cda957;font-size:13px;font-weight:800;letter-spacing:1.2px;text-align:center;z-index:1}
@media(max-height:650px){.card{height:94vh;padding:14px 14px}.logo-wrap{width:110px;height:110px;margin-bottom:12px}.brand{font-size:16px;margin-bottom:10px}.pill{min-height:43px;font-size:12px;padding:7px 10px}.pill.small{min-height:38px}.join{height:68px;margin-top:16px;font-size:16px}.note{font-size:10px;margin-top:8px}}
@media(max-width:360px){.card{width:95vw}.logo-wrap{width:100px;height:100px}.pill{font-size:11px}.join{font-size:14px}}
</style>
</head>
